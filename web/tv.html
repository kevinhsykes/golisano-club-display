<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Portfolio TV</title>
<style>
/* 10-foot layout for a 16:9 TV. Sizes use vh so 1080p and 4K render the same. */
:root {
  --bg: #061a28;
  --panel: #0c2537;
  --panel-2: #112f45;
  --line: #1f4560;
  --text: #f3eee3;
  --muted: #a9b8c4;
  --gold: #d5ba7e;
  --gold-soft: #eed7a4;
  --up: #3ccf86;
  --down: #ff6b5e;
  --flat: #a9b8c4;
  --warn-bg: #4a3500;
  --warn: #ffd27a;
  --serif: Georgia, "DejaVu Serif", "Liberation Serif", serif;
  --sans: "Segoe UI", Roboto, "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 400 2.4vh/1.25 var(--sans); font-variant-numeric: tabular-nums; cursor: none; }
.tv { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto 1fr auto auto; gap: 1.6vh; padding: 2.4vh 2.6vw 1.6vh; transition: transform 2s ease; }
/* Fixed rows, so the hidden banner leaves an empty row instead of shifting the layout. */
.tv > header { grid-row: 1; } .tv > .delay { grid-row: 2; } .tv > .banner { grid-row: 3; }
.tv > main { grid-row: 4; } .tv > .tape { grid-row: 5; } .tv > footer { grid-row: 6; }

header { display: flex; align-items: center; gap: 2vw; padding-bottom: 1.4vh; border-bottom: 2px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 1.2vw; margin-right: auto; }
.brand .org { font: 600 2.1vh var(--sans); letter-spacing: .32em; color: var(--gold); text-transform: uppercase; }
.brand .club { font: 500 4.2vh var(--serif); }
.status { display: flex; align-items: center; gap: .8vw; font-size: 2.6vh; }
.pill { padding: .5vh 1.1vw; border-radius: 99px; border: 2px solid var(--line); font-weight: 600; }
.pill.open { border-color: var(--up); color: var(--up); }
.pill.open::before { content: "● "; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.clock { font: 600 3.4vh var(--sans); min-width: 11vw; text-align: right; }
.delay { font-size: 2.5vh; color: var(--gold-soft); margin-top: -.6vh; }
.brand, .status, .pill { white-space: nowrap; }
.tape .notice { color: var(--gold-soft); }

.banner { display: none; padding: 1vh 1.4vw; border-radius: 1vh; font-size: 2.5vh; }
.banner.show { display: block; }
.banner.stale { background: var(--warn-bg); color: var(--warn); border: 2px solid var(--warn); }
.banner.closed { background: var(--panel); color: var(--muted); border: 2px solid var(--line); }

main { display: grid; grid-template-columns: 31fr 69fr; gap: 1.4vw; min-height: 0; }
.left { display: grid; min-height: 0; min-width: 0; }
.left .card { display: flex; flex-direction: column; justify-content: space-between; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 1.4vh; padding: 2vh 1.4vw; min-height: 0; }
.label { font-size: 2.5vh; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.big { font: 600 7.6vh/1.05 var(--sans); margin: .4vh 0 1vh; letter-spacing: -.01em; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 2.6vh 1.2vw; }
.kpi .s { font-size: 2.5vh; color: var(--muted); }
.kpi .v { font: 600 3.8vh/1.15 var(--sans); }
.kpi .v2 { font: 600 2.6vh var(--sans); }
.split .track { height: 2.6vh; border-radius: 99px; background: #b9a0f0; overflow: hidden; }
.split .track i { display: block; height: 100%; background: #7fb0ec; border-right: .3vw solid var(--panel); }
.split .legend { display: grid; gap: .2vh; margin-top: 1vh; font-size: 2.6vh; color: var(--muted); }
.split .legend i { display: inline-block; width: 1.6vh; height: 1.6vh; border-radius: 50%; margin-right: .6vw; }
.split .legend b { font: 700 3.2vh var(--sans); color: var(--text); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }
.panel.chart.on { grid-template-rows: 1fr auto; background: var(--panel); border: 1px solid var(--line); border-radius: 1.4vh; padding: 2vh 1.4vw; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart .grid { stroke: var(--line); stroke-width: .14vh; }
.chart .axis { fill: var(--muted); font: 500 2.5vh var(--sans); }
.chart .line { fill: none; stroke: var(--gold); stroke-width: .37vh; stroke-linejoin: round; }
.chart .dot { fill: var(--bg); stroke: var(--gold-soft); stroke-width: .37vh; }
.chart .dot.live { fill: var(--gold); }
.chart .zero { stroke: var(--muted); stroke-width: .14vh; stroke-dasharray: .5vh .5vh; }
.chart .line.spy { stroke: #7fb0ec; stroke-dasharray: 1vh .6vh; } .chart .dot.spy { stroke: #7fb0ec; }
.chart .line.picks { stroke: #b9a0f0; } .chart .dot.picks { stroke: #b9a0f0; }
.chart .endlabel { font: 600 2.9vh var(--sans); fill: var(--gold-soft); }
.chart .endlabel.spy { fill: #7fb0ec; } .chart .endlabel.picks { fill: #b9a0f0; }
.chart .note { font-size: 2.4vh; color: var(--muted); }

.right { position: relative; min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: 1.2vh; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; }
.panel-head h2 { margin: 0; font: 500 3.2vh var(--serif); }
.dots { display: flex; gap: .6vw; }
.dots i { width: 1.8vh; height: 1.8vh; border-radius: 50%; background: #3d6380; }
.dots i.on { background: var(--gold); }
.panel { display: none; min-height: 0; }
.panel.on { display: grid; }

/* Holdings as rows of a 2 x 5 grid, ten per page (10-foot guidance: few items, text >= 27 px at 1080p).
   One line per holding: symbol, price, today's move, gain vs cost. The tint is only a side bar,
   so the numbers keep full contrast on any day. */
.rows10 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr); grid-auto-flow: column; gap: 1.1vh 1vw; }
.tile { position: relative; border-radius: 1.2vh; padding: 0 1.1vw 0 1.6vw; background: var(--panel); border: 1px solid var(--line); overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-content: center; column-gap: 1vw; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .7vw; background: var(--bar, var(--line)); }
.tile .sym { font: 700 4.6vh/1.05 var(--sans); letter-spacing: .02em; display: flex; align-items: center; gap: .7vw; min-width: 0; }
.tile .px { font: 500 2.9vh var(--sans); color: var(--muted); }
.tile .px b { color: var(--text); font-weight: 600; }
.tile .day { font: 700 4.4vh/1.05 var(--sans); white-space: nowrap; text-align: right; }
.tile .meta { font: 500 2.7vh var(--sans); color: var(--muted); white-space: nowrap; text-align: right; }
.tile .meta b { font-weight: 700; }
.tile.stop-near { border-color: var(--warn); }
.tile.stop-hit { border-color: var(--down); box-shadow: inset 0 0 0 2px var(--down); }
.badge { font: 700 1.9vh/1 var(--sans); letter-spacing: .1em; padding: .55vh .5vw; border-radius: .6vh; background: var(--gold); color: var(--bg); white-space: nowrap; }

/* New positions: one large card each, with the stop-loss rule drawn as a distance bar. */
.newpos { grid-auto-flow: row; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 1.4vw; }
.np { background: var(--panel); border: 2px solid var(--gold); border-radius: 1.6vh; padding: 2.2vh 1.6vw; display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; overflow: hidden; }
.np .head { display: flex; align-items: baseline; gap: 1vw; flex-wrap: wrap; }
.np .sym { font: 700 7vh/1 var(--sans); }
.np .nm { font: 500 3.2vh var(--serif); color: var(--text); }
.np .what { font-size: 2.5vh; color: var(--muted); line-height: 1.3; }
.np .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh 1.2vw; }
.np .nums .s { font-size: 2.5vh; color: var(--muted); }
.np .nums .v { font: 700 4.6vh/1.1 var(--sans); }
.np .stop { margin-top: auto; border-top: 2px solid var(--line); padding-top: 1.6vh; }
.np .stop .line { font: 600 3vh var(--sans); }
.np .stop .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 2vw; }
.np .stop .facts .s { font-size: 2.5vh; color: var(--muted); }
.np .stop .facts .f { font: 700 4.2vh var(--sans); margin-top: .4vh; }
.np .stop .rule { font-size: 2.4vh; color: var(--muted); margin-top: .6vh; }
.stopbar { position: relative; height: 2.4vh; border-radius: 99px; background: var(--panel-2); margin-top: 1.2vh; overflow: hidden; }
.stopbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--up); }
.stopbar.near i { background: var(--warn); } .stopbar.hit i { background: var(--down); }
.warn { color: var(--warn); }

.movers { grid-template-columns: 1fr 1fr; gap: 1.6vw; }
.movers h3 { margin: 0 0 1vh; font: 600 2.4vh var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mrow { display: grid; grid-template-columns: 8vw 1fr auto; align-items: baseline; padding: 1.8vh 0; border-bottom: 1px solid var(--line); font-size: 3vh; }
.mrow .sym { font-weight: 700; font-size: 3.4vh; }
.mrow .nm { color: var(--muted); font-size: 2.6vh; padding-right: 1vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.alloc { margin-top: 2.6vh; }
.bar { display: grid; grid-template-columns: 15vw 1fr 6vw; align-items: center; gap: 1vw; margin: 1.1vh 0; font-size: 2.6vh; }
.bar .track { height: 2.2vh; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--gold); }
.bar .pct { text-align: right; font-weight: 600; }

/* Recent trades: one row per order, newest first. */
.trades { grid-template-rows: repeat(var(--rows, 6), minmax(0, 1fr)) auto; gap: 1vh; }
.trow { display: grid; grid-template-columns: 5.6vw 6.5vw minmax(0, 1fr) 15vw 10.6vw; align-items: center; column-gap: 1.2vw;
  background: var(--panel); border: 1px solid var(--line); border-radius: 1.2vh; padding: 0 1.4vw; min-height: 0; }
.trow .d { font: 600 2.8vh var(--sans); color: var(--muted); }
.trow .side { font: 700 2.2vh/1 var(--sans); letter-spacing: .1em; padding: .8vh 0; border-radius: .6vh; text-align: center; color: var(--bg); }
.trow .side.buy { background: var(--up); } .trow .side.sell { background: var(--down); }
.trow .who { min-width: 0; display: flex; flex-direction: column; overflow: hidden; } .trow .who b { font: 700 4.2vh/1.05 var(--sans); }
.trow .who span { font: 500 2.6vh var(--serif); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.trow .fill { font: 600 3.2vh var(--sans); white-space: nowrap; min-width: 0; } .trow .fill small { display: block; font: 500 2.4vh var(--sans); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.trow .since { text-align: right; font: 700 3.6vh var(--sans); white-space: nowrap; } .trow .since small { display: block; font: 500 2.4vh var(--sans); color: var(--muted); }
.trades .tnote { font-size: 2.4vh; color: var(--muted); }

.tape { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 1vh 0; white-space: nowrap; }
.tape .track { display: inline-block; animation: scroll var(--tape-duration, 80s) linear infinite; }
.tape span { margin-right: 3.2vw; font-size: 3.2vh; }
.tape b { margin-right: .6vw; }
.tape .badge { font-size: 1.9vh; margin-right: .6vw; vertical-align: .3vh; }
@keyframes scroll { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape .track { animation: none; } .pill.open::before { animation: none; } }

footer { display: flex; justify-content: space-between; gap: 2vw; font-size: 2.2vh; color: var(--muted); }
footer #disclosure { white-space: nowrap; flex: none; }
footer .src { text-align: right; min-width: 0; overflow-wrap: anywhere; }   /* a long attribution wraps here; it is never cut off */
.error { display: grid; place-items: center; height: 100vh; font-size: 3vh; color: var(--muted); }
</style>
</head>
<body>
<div class="tv" id="tv">
  <header>
    <div class="brand"><span class="org">Golisano Institute</span><span class="club">Investment Club</span></div>
    <div class="status"><span class="pill" id="pill">…</span><span id="session-note"></span></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="delay" id="delay"></div>
  <div class="banner" id="banner" role="status"></div>
  <main>
    <section class="left">
      <div class="card">
        <div class="label" id="hero-label">Portfolio value</div>
        <div class="big" id="hero">—</div>
        <div class="kpis">
          <div class="kpi"><div class="s" id="day-label">Today</div><div class="v" id="day">—</div><div class="v2" id="day2"></div></div>
          <div class="kpi"><div class="s" id="spy-label">SPY today</div><div class="v" id="spy">—</div></div>
          <div class="kpi"><div class="s" id="gain-label">Gain vs cost</div><div class="v" id="gain">—</div><div class="v2" id="gain2"></div></div>
          <div class="kpi"><div class="s">Since Sept 22</div><div class="v" id="since">—</div></div>
        </div>
        <div class="split" id="split"></div>
      </div>
    </section>
    <section class="right">
      <div class="panel-head"><h2 id="panel-title">Holdings</h2><div class="dots" id="dots"></div></div>
      <div class="panel newpos" id="p-new" data-title="New positions"></div>
      <div id="holding-pages" style="display:contents"></div>
      <div class="panel trades" id="p-trades" data-title="Recent trades"></div>
      <div class="panel movers" id="p-movers" data-title="Today's biggest moves"></div>
      <div class="panel chart" id="p-chart" data-title="Portfolio since Sept 22">
        <div id="chart" style="position:relative; min-height:0"></div>
        <div class="note">Gain over what we paid, at each saved price check. 0% = break-even. Stock picks = every holding except SPY.</div>
      </div>
    </section>
  </main>
  <div class="tape" aria-hidden="true"><div class="track" id="tape"></div></div>
  <footer><div id="disclosure"></div><div class="src" id="source"></div></footer>
</div>
<script type="module">
import {
  fetchJson, fetchVersion, buildChanged, mergeQuotes, marketStatus, freshness, compute, comparisonSeries, compareChart, el,
  sinceStatement, isNew, totalGain,
  fmtUsd, fmtSignedUsd, fmtPct, fmtWeight, fmtPrice, arrow, dir, fmtTime, fmtDay, fmtShortDate,
  STATUS_LABEL, newestQuote, oldestQuote, delayNotice,
} from './core.js';

const params = new URLSearchParams(location.search);
// Only relative, same-origin paths may be loaded from the address bar.
const samePath = v => (v && !/^[a-z]+:|^\/\//i.test(v) ? v : null);
const CONFIG = {
  data: samePath(params.get('data')) || 'data/portfolio.json',
  quotes: samePath(params.get('quotes')),                  // default: payload.live_quotes_url (api/quotes)
  hideAmounts: params.get('amounts') === 'hide',
  rotateSeconds: Number(params.get('rotate') || 20),
  panel: params.get('panel'),                     // new | trades | h1 | h2 | h3 | movers | chart pins one panel

  pollSeconds: 60,
  reloadHours: 6,
  now: params.get('now') ? new Date(params.get('now')) : null, // test hook
};
const now = () => CONFIG.now || new Date();
const $ = id => document.getElementById(id);
let payload;
let bootVersion = null;

async function boot() {
  try {
    payload = await fetchJson(CONFIG.data);
  } catch (e) {
    document.body.replaceChildren(el('div', { class: 'error' }, 'Portfolio data is unavailable. Retrying in one minute.'));
    setTimeout(() => location.reload(), 60000);
    return;
  }
  bootVersion = await fetchVersion();
  if (CONFIG.hideAmounts) payload.amounts = payload.amounts === 'shown' ? 'shown-hidden' : payload.amounts;
  CONFIG.quotes = CONFIG.quotes ?? payload.live_quotes_url ?? null;
  render();
  poll();
  setInterval(tick, 1000);
  setInterval(poll, CONFIG.pollSeconds * 1000);
  setInterval(rotate, CONFIG.rotateSeconds * 1000);
  setInterval(shift, 180000);
  setTimeout(() => location.reload(), CONFIG.reloadHours * 3600000);
}

async function poll() {
  const v = await fetchVersion();
  if (buildChanged(bootVersion, v)) { location.reload(); return; }
  try {
    if (CONFIG.quotes) {
      if (mergeQuotes(payload, await fetchJson(CONFIG.quotes))) render();
    } else {
      const fresh = await fetchJson(CONFIG.data);
      if (newestQuote(fresh.quotes.items) > newestQuote(payload.quotes.items)) {
        fresh.amounts = payload.amounts;
        payload = fresh;
        render();
      }
    }
  } catch { /* keep last good prices; the banner reports their age */ }
  renderStatus();
}

function tick() {
  $('clock').textContent = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }).format(now());
  if (new Date().getSeconds() === 0) renderStatus();
}

function render() {
  const forceHide = payload.amounts === 'shown-hidden';
  const base = forceHide ? { ...payload, amounts: 'shown' } : payload;
  const s = compute(base);
  const showDollars = s.dollars && !forceHide;
  renderNew(s, showDollars);
  renderHoldings(s);
  renderStatus();      // after the pages exist: it writes their titles
  renderHero(s, showDollars);
  renderChart(base, s, showDollars);
  renderMovers(s);
  renderTrades(s, showDollars);
  renderTape(s);
  // One line on the TV; the full notes (what is and is not counted, how the return is worked out) are on the portfolio page.
  $('disclosure').textContent = 'Educational display, not investment advice. Cash, dividends and fees are not counted'
    + ((payload.trades || []).some(t => t.estimated) ? '; some trade prices are estimates.' : '.');
  const src = payload.quotes.meta?.attribution || [...new Set(payload.quotes.items.map(q => q.provider))].join(', ');
  $('source').textContent = `${src} · quotes ${fmtTime(oldestQuote(payload.quotes.items))}–${fmtTime(newestQuote(payload.quotes.items))}, ${fmtDay(newestQuote(payload.quotes.items))}`;
  if (!document.querySelector('.panel.on')) rotate();
}

function renderStatus() {
  const st = marketStatus(now(), payload.calendar);
  const fr = freshness(payload.quotes.items, st, now(), payload.quotes.meta?.delay_minutes || 0);
  const pill = $('pill');
  pill.className = `pill ${st.state}`;
  pill.textContent = st.holiday ? 'Market holiday' : STATUS_LABEL[st.state];
  $('session-note').textContent = st.earlyClose && (st.state === 'pre' || st.state === 'open') ? `Closes ${st.earlyClose.replace(/^13:00$/, '1:00 PM')} ET today` : '';
  const b = $('banner');
  const newest = fmtTime(fr.newest) + ', ' + fmtDay(fr.newest);
  if (!st.calendarKnown) {
    b.className = 'banner stale show';
    b.textContent = 'Exchange calendar needs updating (data/source/xnys-calendar.json); holidays and early closes are unknown.';
  } else if (fr.level === 'stale') {
    b.className = 'banner stale show';
    b.textContent = `${fr.reason}. Last saved price: ${newest}. Numbers below are from then, not now.`;
  } else if (fr.level === 'closed') {
    // Not a warning, so it does not take a row of its own: it joins the notice line under the header.
    b.className = 'banner';
    b.textContent = '';
  } else {
    b.className = 'banner';
    b.textContent = '';
  }
  $('delay').textContent = delayNotice(payload) + (st.calendarKnown && fr.level === 'closed' ? ` · Market closed: prices from ${newest}` : '');
  $('day-label').textContent = fr.level === 'live' ? 'Today' : `Day change, ${fmtShortDate(fr.newest)}`;
  $('spy-label').textContent = fr.level === 'live' ? 'SPY today' : `SPY, ${fmtShortDate(fr.newest)}`;
  const when = fr.level === 'live' ? 'today' : fmtShortDate(fr.newest);
  holdingPages.forEach((id, i) => {
    const n = $(id).childElementCount, from = i * PER_PAGE + 1;
    $(id).dataset.title = `Holdings ${from}–${from + n - 1} of ${holdingCount}, largest first · move ${when}`;
  });
  $('p-movers').dataset.title = `Biggest moves · ${when}`;
  if (panelIdx >= 0) $('panel-title').textContent = $(PANELS[panelIdx]).dataset.title;
}

function base() {
  return payload.amounts === 'shown-hidden' ? { ...payload, amounts: 'shown' } : payload;
}

function renderHero(s, showDollars) {
  const set = (id, text, d, cls = 'v') => { const n = $(id); n.textContent = text; n.className = `${cls} ${d ? dir(d) : ''}`; };
  const since = sinceStatement(base(), s);
  const tg = totalGain(base(), s);   // unrealized + gains locked in by sales
  if (showDollars) {
    $('hero-label').textContent = 'Portfolio value';
    $('hero').textContent = fmtUsd(s.total);
    $('hero').className = 'big';
    set('day', `${arrow(s.dayChange)} ${fmtSignedUsd(s.dayChange)}`, s.dayChange);
    set('day2', fmtPct(s.dayPct), s.dayChange, 'v2');
    set('gain', fmtSignedUsd(tg.gain), tg.gain);
    set('gain2', tg.realized ? `${fmtPct(tg.pct)} · ${fmtSignedUsd(tg.realized)} from sales` : fmtPct(tg.pct), tg.gain, 'v2');
  } else {
    $('hero-label').textContent = 'Gain vs cost';
    $('hero').textContent = fmtPct(tg.pct);
    $('hero').className = `big ${dir(tg.pct)}`;
    set('day', `${arrow(s.dayPct)} ${fmtPct(s.dayPct)}`, s.dayPct);
    set('day2', '', 0, 'v2');
    set('gain', fmtPct(tg.pct), tg.pct);
    set('gain2', '', 0, 'v2');
  }
  set('since', fmtPct(since), since);
  set('spy', s.spyDayPct === null ? '—' : `${arrow(s.spyDayPct)} ${fmtPct(s.spyDayPct)}`, s.spyDayPct);
  // Where the money is, always on screen: the index fund against everything the club picked.
  const spyW = s.rows.filter(r => r.symbol === 'SPY').reduce((a, r) => a + r.weight, 0);
  const picks = s.rows.filter(r => r.symbol !== 'SPY').length;
  $('split').replaceChildren(...(spyW > 0 && picks ? [
    el('div', { class: 'track' }, el('i', { style: `width:${spyW * 100}%` })),
    el('div', { class: 'legend' },
      el('span', {}, el('i', { style: 'background:#7fb0ec' }), el('b', {}, fmtWeight(spyW)), ' S&P 500 fund (SPY)'),
      el('span', {}, el('i', { style: 'background:#b9a0f0' }), el('b', {}, fmtWeight(1 - spyW)), ` ${picks} stock pick${picks === 1 ? '' : 's'}`)),
  ] : []));
}

function renderChart(base, s, showDollars) {
  $('p-chart').dataset.title = 'Gain over cost: portfolio vs our SPY position';
  if (PANELS[panelIdx] === 'p-chart') $('panel-title').textContent = $('p-chart').dataset.title;
  const box = $('chart');
  if (!box.clientHeight) return; // hidden panel; the ResizeObserver redraws it when shown
  // The svg is absolutely positioned, so the box size comes from the layout alone.
  const w = Math.max(200, box.clientWidth), h = Math.max(120, box.clientHeight);
  const unit = innerHeight / 1080;
  box.replaceChildren(compareChart(comparisonSeries(base, s), { width: w, height: h, pad: 26 * unit, left: 92 * unit, right: 380 * unit, unit, charPx: 15 * unit }));
  box.dataset.size = `${w}x${h}`;
}

// Redraw when the chart box changes size (banner appearing, delay line, window resize).
new ResizeObserver(() => {
  const box = $('chart');
  if (payload && box.dataset.size !== `${box.clientWidth}x${box.clientHeight}`) render();
}).observe(document.getElementById('chart'));

const barColor = pct => (pct > 0 ? 'var(--up)' : pct < 0 ? 'var(--down)' : 'var(--line)');
const sym = r => r.symbol.replace('/', '.');
const PER_PAGE = 10;
let holdingPages = [], holdingCount = 0;

function stopText(r) {
  if (r.stopPrice === undefined) return null;
  if (r.stopLevel === 'hit') return `At or below the stop ($${fmtPrice(r.stopPrice)})`;
  return `Stop $${fmtPrice(r.stopPrice)} · ${(r.stopGap * 100).toFixed(1)}% below`;
}

// Holdings in pages of ten (two columns of five), largest first. Pages are made from the
// holding count, so a new position adds a page instead of overflowing a fixed grid.
function renderHoldings(s) {
  const rows = [...s.rows].sort((a, b) => b.weight - a.weight);
  const t = now().getTime();
  const tile = r => el('div', { class: `tile ${r.stopLevel && r.stopLevel !== 'ok' ? `stop-${r.stopLevel}` : ''}`, style: `--bar:${barColor(r.dayPct)}` },
    el('div', { class: 'sym' }, sym(r), isNew(r, t) ? el('span', { class: 'badge' }, 'NEW') : null),
    el('div', { class: `day ${dir(r.dayPct)}` }, `${arrow(r.dayPct)} ${fmtPct(r.dayPct)}`),
    el('div', { class: 'px' }, el('b', {}, `$${fmtPrice(r.price)}`), ` · ${fmtWeight(r.weight)}`),
    r.stopLevel && r.stopLevel !== 'ok'
      ? el('div', { class: 'meta' }, el('b', { class: r.stopLevel === 'hit' ? 'down' : 'warn' }, r.stopLevel === 'hit' ? 'AT STOP' : 'NEAR STOP'))
      : el('div', { class: 'meta' }, isNew(r, t) ? 'since buy ' : 'vs cost ',
        el('b', { class: dir(isNew(r, t) ? r.sinceBuy : r.costPct) }, fmtPct(isNew(r, t) ? r.sinceBuy : r.costPct, 1))));
  const pages = [];
  for (let i = 0; i < rows.length; i += PER_PAGE) pages.push(rows.slice(i, i + PER_PAGE));
  holdingCount = rows.length;
  const ids = pages.map((_, i) => `p-h${i + 1}`);
  if (ids.join() !== holdingPages.join()) {
    $('holding-pages').replaceChildren(...ids.map(id => el('div', { class: 'panel rows10', id })));
    holdingPages = ids;
    setPanels();
  }
  pages.forEach((pg, i) => $(ids[i]).replaceChildren(...pg.map(tile)));
}

// One large card per position bought in the last two weeks, with the stop-loss rule if one is
// recorded. The panel leaves the rotation when there is nothing new.
function renderNew(s, showDollars) {
  const t = now().getTime();
  const fresh = s.rows.filter(r => isNew(r, t)).sort((a, b) => b.openedAt - a.openedAt || a.symbol.localeCompare(b.symbol));
  newCount = fresh.length;
  const card = r => {
    const stop = stopText(r);
    const range = r.stopPrice !== undefined ? Math.max(0, Math.min(1, (r.price - r.stopPrice) / (r.buyPrice - r.stopPrice) / 1.5)) : 0;
    return el('div', { class: 'np' },
      el('div', { class: 'head' }, el('span', { class: 'sym' }, sym(r)), el('span', { class: 'nm' }, r.name),
        el('span', { class: 'badge' }, `BOUGHT ${fmtShortDate(r.openedAt).toUpperCase()}`)),
      r.industry ? el('div', { class: 'what' }, r.industry) : null,
      el('div', { class: 'nums' },
        el('div', {}, el('div', { class: 's' }, 'Bought at'), el('div', { class: 'v' }, `$${fmtPrice(r.buyPrice)}`)),
        el('div', {}, el('div', { class: 's' }, 'Now'), el('div', { class: 'v' }, `$${fmtPrice(r.price)}`)),
        el('div', {}, el('div', { class: 's' }, 'Since we bought'), el('div', { class: `v ${dir(r.sinceBuy)}` }, `${arrow(r.sinceBuy)} ${fmtPct(r.sinceBuy, 1)}`)),
        showDollars
          ? el('div', {}, el('div', { class: 's' }, `${r.shares} shares, worth`), el('div', { class: 'v' }, fmtUsd(r.value)))
          : el('div', {}, el('div', { class: 's' }, 'Share of portfolio'), el('div', { class: 'v' }, fmtWeight(r.weight)))),
      el('div', { class: 'stop' },
        stop
          ? [el('div', { class: `line ${r.stopLevel === 'ok' ? '' : r.stopLevel === 'hit' ? 'down' : 'warn'}` }, stop),
            el('div', { class: `stopbar ${r.stopLevel}`, role: 'img', 'aria-label': `Price distance above the stop: ${(r.stopGap * 100).toFixed(1)}%` },
              el('i', { style: `width:${(range * 100).toFixed(1)}%` })),
            el('div', { class: 'rule' }, r.stopRule ? `Rule: ${r.stopRule.replace(/\s*\(.*\)\.?$/, '.')}` : '')]
          : el('div', { class: 'facts' },
            el('div', {}, el('div', { class: 's' }, 'Stock today'), el('div', { class: `f ${dir(r.stockDayPct)}` }, `${arrow(r.stockDayPct)} ${fmtPct(r.stockDayPct, 1)}`)),
            el('div', {}, el('div', { class: 's' }, 'Share of portfolio'), el('div', { class: 'f' }, fmtWeight(r.weight))))));
  };
  $('p-new').style.setProperty('--n', Math.min(Math.max(fresh.length, 1), 3));
  $('p-new').replaceChildren(...fresh.slice(0, 3).map(card));
  $('p-new').dataset.title = fresh.length === 1 ? `New position · bought ${fmtShortDate(fresh[0].openedAt)}` : `New positions · bought ${[...new Set(fresh.map(r => fmtShortDate(r.openedAt)))].join(', ')}`;
  if (Boolean(fresh.length) !== PANELS.includes('p-new')) setPanels();
}

function renderMovers(s) {
  const byDay = [...s.rows].sort((a, b) => b.dayPct - a.dayPct);
  const row = r => el('div', { class: 'mrow' },
    el('span', { class: 'sym' }, sym(r)),
    el('span', { class: 'nm' }, r.name),
    el('span', { class: dir(r.dayPct) }, `${arrow(r.dayPct)} ${fmtPct(r.dayPct)}`));
  const mag7 = new Set(['AAPL', 'MSFT', 'AMZN', 'GOOGL', 'META', 'NVDA', 'TSLA']);
  const w = pred => s.rows.filter(pred).reduce((a, r) => a + r.weight, 0);
  const groups = [
    ['S&P 500 fund (SPY)', w(r => r.symbol === 'SPY')],
    ['Magnificent Seven', w(r => mag7.has(r.symbol))],
    ['Other stocks', w(r => r.symbol !== 'SPY' && !mag7.has(r.symbol))],
  ];
  $('p-movers').replaceChildren(
    el('div', {}, el('h3', {}, 'Leading'), byDay.slice(0, 4).map(row),
      el('div', { class: 'alloc' }, el('h3', {}, 'Where the money is'),
        groups.map(([name, x]) => el('div', { class: 'bar' }, el('span', {}, name),
          el('span', { class: 'track' }, el('i', { style: `width:${x * 100}%` })), el('span', { class: 'pct' }, fmtWeight(x)))))),
    el('div', {}, el('h3', {}, 'Lagging'), byDay.slice(-4).reverse().map(row),
      el('div', { class: 'alloc' }, el('h3', {}, 'Largest positions'),
        [...s.rows].sort((a, b) => b.weight - a.weight).slice(0, 3).map(r => el('div', { class: 'bar' }, el('span', {}, r.symbol.replace('/', '.')),
          el('span', { class: 'track' }, el('i', { style: `width:${r.weight * 100}%` })), el('span', { class: 'pct' }, fmtWeight(r.weight)))))),
  );
}

// Recent trades, newest first. "Since" is what the price did after the trade: for a buy it is our
// gain on those shares; for a sale it is what we avoided or missed, so its colour is reversed.
const TRADE_ROWS = 6;
let tradeCount = 0;
function renderTrades(s, showDollars) {
  const prices = new Map(s.rows.map(r => [r.symbol, r.price]));
  const list = [...(payload.trades || [])].sort((a, b) => b.executed_at_utc.localeCompare(a.executed_at_utc) || a.symbol.localeCompare(b.symbol));
  tradeCount = list.length;
  const row = t => {
    const px = Number(t.price), now = prices.get(t.symbol);
    const x = now ? now / px - 1 : null;
    return el('div', { class: 'trow' },
      el('div', { class: 'd' }, fmtShortDate(Date.parse(t.executed_at_utc))),
      el('div', { class: `side ${t.type}` }, t.type === 'buy' ? 'BUY' : 'SELL'),
      el('div', { class: 'who' }, el('b', {}, t.symbol.replace('/', '.')), el('span', {}, t.name)),
      el('div', { class: 'fill' }, showDollars && t.shares ? `${t.shares} @ $${fmtPrice(px)}` : `at $${fmtPrice(px)}`,
        el('small', {}, [t.estimated ? 'est. price' : null, showDollars && t.realized_gain ? `${fmtSignedUsd(Number(t.realized_gain))} gain` : null].filter(Boolean).join(' · ') || (showDollars && t.amount ? fmtUsd(Number(t.amount)) : ''))),
      el('div', { class: `since ${x === null ? '' : dir(t.type === 'buy' ? x : -x)}` }, x === null ? '—' : `${arrow(x)} ${fmtPct(x, 1)}`,
        el('small', {}, t.type === 'buy' ? 'since we bought' : 'since we sold')));
  };
  const shown = list.slice(0, TRADE_ROWS);
  $('p-trades').style.setProperty('--rows', Math.max(shown.length, 4));
  $('p-trades').replaceChildren(...shown.map(row),
    el('div', { class: 'tnote' }, list.length > shown.length ? `${list.length - shown.length} earlier trades on the trades page. ` : '',
      'Every trade since the Sept 22 statement is on the trades page.'));
  $('p-trades').dataset.title = list.length ? `Recent trades · ${list.length} since Sept 22` : 'Recent trades';
  if (Boolean(list.length) !== PANELS.includes('p-trades')) setPanels();
}

function renderTape(s) {
  const t = now();
  // New positions lead, in the same order as the New positions panel; the rest keep their order (the sort is stable).
  const order = [...s.rows].sort((a, b) => isNew(b, t) - isNew(a, t) || (isNew(a, t) ? b.openedAt - a.openedAt || a.symbol.localeCompare(b.symbol) : 0));
  const items = order.map(r => el('span', {}, el('b', {}, r.symbol.replace('/', '.')), isNew(r, t) ? el('span', { class: 'badge' }, 'NEW') : null, `$${fmtPrice(r.price)} `,
    el('span', { class: dir(r.stockDayPct), style: 'margin:0' }, `${arrow(r.stockDayPct)} ${fmtPct(r.stockDayPct)}`)));
  // The delay notice must recur at least every 90 seconds on a ticker; the track holds
  // two copies of the list, so it appears twice per scroll cycle.
  items.unshift(el('span', { class: 'notice' }, delayNotice(payload)));
  const clone = items.map(n => n.cloneNode(true));
  $('tape').replaceChildren(...items, ...clone);
  $('tape').style.setProperty('--tape-duration', `${items.length * 4.5}s`);
}

let PANELS = [];
let panelIdx = -1, newCount = 0;
// Rotation: new positions (while any are new), recent trades, each holdings page, movers, chart.
function setPanels() {
  const current = PANELS[panelIdx];
  PANELS = [...(newCount ? ['p-new'] : []), ...(tradeCount ? ['p-trades'] : []), ...holdingPages, 'p-movers', 'p-chart'];
  panelIdx = PANELS.indexOf(current);
  // A pinned panel (?panel=) may only exist once its page is built: switch to it then.
  if (panelIdx < 0 || (PANELS.includes(`p-${CONFIG.panel}`) && current !== `p-${CONFIG.panel}`)) { panelIdx = -1; rotate(); return; }
  PANELS.forEach((id, i) => $(id).classList.toggle('on', i === panelIdx));
  $('dots').replaceChildren(...PANELS.map((_, i) => el('i', { class: i === panelIdx ? 'on' : '' })));
}
function rotate() {
  if (!PANELS.length) return;
  const pinned = PANELS.indexOf(`p-${CONFIG.panel}`);
  if (pinned >= 0 && panelIdx === pinned) return;
  panelIdx = pinned >= 0 ? pinned : (panelIdx + 1) % PANELS.length;
  document.querySelectorAll('.right .panel').forEach(n => n.classList.toggle('on', n.id === PANELS[panelIdx]));
  $('panel-title').textContent = $(PANELS[panelIdx]).dataset.title;
  $('dots').replaceChildren(...PANELS.map((_, i) => el('i', { class: i === panelIdx ? 'on' : '' })));
}

// Small periodic shift of the whole layout to spread static pixels (burn-in care).
const OFFSETS = [[0, 0], [3, 2], [-3, 3], [2, -3], [-2, -2]];
let shiftIdx = 0;
function shift() {
  shiftIdx = (shiftIdx + 1) % OFFSETS.length;
  const [x, y] = OFFSETS[shiftIdx];
  $('tv').style.transform = `translate(${x}px, ${y}px)`;
}

window.addEventListener('resize', () => payload && render());
boot();
</script>
</body>
</html>
