<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Portfolio TV</title>
<style>
/* 10-foot layout for a 16:9 TV seen from 4-6 m. Sizes use vh so 720p, 1080p and 4K render the same.
   Minimum text is 3vh (footer fine print 2.6vh). Sized for DejaVu Sans, the widest font in the stack. */
:root {
  --bg: #061a28;
  --panel: #0c2537;
  --panel-2: #112f45;
  --line: #1f4560;
  --text: #f3eee3;
  --muted: #a9b8c4;
  --gold: #d5ba7e;
  --gold-soft: #eed7a4;
  /* Up/down pair checked for deuteranopia (validator delta-E 10.0); arrows and signs always agree. */
  --up: #2fc9a0;
  --down: #ff7352;
  --flat: #a9b8c4;
  --warn-bg: #4a3500;
  --warn: #ffd27a;
  --serif: Georgia, "DejaVu Serif", "Liberation Serif", serif;
  --sans: "Segoe UI", Roboto, "DejaVu Sans", "Liberation Sans", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 400 3vh/1.25 var(--sans); font-variant-numeric: tabular-nums; cursor: none; }
.tv { height: 100vh; display: grid; grid-template-rows: auto auto auto 1fr auto auto; gap: 1.6vh; padding: 2.4vh 2.6vw 1.6vh; transition: transform 2s ease; }
/* Fixed rows, so the hidden banner leaves an empty row instead of shifting the layout. */
.tv > header { grid-row: 1; } .tv > .strip { grid-row: 2; } .tv > .banner { grid-row: 3; }
.tv > main { grid-row: 4; } .tv > .tape { grid-row: 5; } .tv > footer { grid-row: 6; }

header { display: flex; align-items: center; gap: 2vw; padding-bottom: 1.2vh; border-bottom: 2px solid var(--line); white-space: nowrap; }
.brand { display: flex; align-items: baseline; gap: 1.2vw; margin-right: auto; }
.brand .org { font: 600 3vh var(--sans); letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
.brand .club { font: 500 4.6vh var(--serif); }
.status { display: flex; align-items: center; gap: .8vw; font-size: 3vh; }
.pill { padding: .5vh 1.1vw; border-radius: 99px; border: 2px solid var(--line); font: 600 3vh var(--sans); }
.pill.open { border-color: var(--up); color: var(--up); }
.pill.open::before { content: "● "; animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.clock { font: 600 3.6vh var(--sans); min-width: 11vw; text-align: right; }

/* One line under the header: the required notice on the left, the price time on the right. */
.strip { display: flex; justify-content: space-between; gap: 2vw; font-size: 3vh; white-space: nowrap; margin-top: -.4vh; }
.strip .notice { color: var(--gold-soft); font-weight: 600; flex: none; }
.strip .asof { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

/* Stale and calendar warnings only. Market-closed is a calm state shown by the pill and the strip. */
.banner { display: none; padding: 1vh 1.4vw; border-radius: 1vh; font-size: 3vh; }
.banner.show { display: block; }
.banner.stale { background: var(--warn-bg); color: var(--warn); border: 2px solid var(--warn); }

main { display: grid; grid-template-columns: minmax(0, 31fr) minmax(0, 69fr); gap: 1.4vw; min-height: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 1.4vh; padding: 2vh 1.4vw; min-height: 0; }
.left { display: flex; flex-direction: column; justify-content: space-between; }
.left.compact { justify-content: flex-start; gap: 3vh; }
.label { font-size: 3vh; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.big { font: 600 9vh/1.05 var(--sans); font-variant-numeric: normal; margin: .4vh 0; letter-spacing: -.01em; white-space: nowrap; }
.sub { font-size: 3vh; color: var(--muted); white-space: nowrap; }
.grp { border-top: 2px solid var(--line); padding-top: 1.2vh; }
.cmp { display: flex; justify-content: space-between; align-items: baseline; white-space: nowrap; }
.cmp .who { font: 500 3.4vh var(--sans); }
.cmp .v { font: 700 4.8vh/1.2 var(--sans); }
.cmp.bench .who, .cmp.bench .v { font-weight: 500; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

.right { position: relative; min-height: 0; display: grid; grid-template-rows: auto 1fr; gap: 1.2vh; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1vw; white-space: nowrap; }
.panel-head h2 { margin: 0; font: 500 3.6vh var(--serif); overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; gap: .6vw; flex: none; }
.dots i { width: 1.8vh; height: 1.8vh; border-radius: 50%; background: #3d6380; }
.dots i.on { background: var(--gold); }
.panel { display: none; min-height: 0; }
.panel.on { display: grid; }
.badge { font: 700 2.6vh/1 var(--sans); letter-spacing: .06em; padding: .5vh .5vw; border-radius: .6vh; background: var(--gold); color: var(--bg); white-space: nowrap; }

/* Holdings: ten per page in two columns, filled row by row in weight order. One tile per holding:
   symbol and the STOCK's move today; its share of the total and the club's gain on it. The colour
   is only a side bar, so the numbers keep full contrast. */
.rows10 { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, 1fr); gap: 1vh 1vw; }
.tile { position: relative; border-radius: 1.2vh; padding: 0 .8vw 0 1.4vw; background: var(--panel); border: 1px solid var(--line); overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto; align-content: center; column-gap: 1vw; white-space: nowrap; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .7vw; background: var(--bar, var(--line)); }
.tile .sym { font: 700 4.4vh/1.05 var(--sans); display: flex; align-items: center; gap: .7vw; min-width: 0; }
.tile .day { font: 700 4.4vh/1.05 var(--sans); text-align: right; }
.tile .px { font: 500 3vh var(--sans); color: var(--muted); } .tile .px b { color: var(--text); font-weight: 600; }
.tile .meta { font: 500 3vh var(--sans); color: var(--muted); text-align: right; } .tile .meta b { font-weight: 700; }
.tile.stop-near { border-color: var(--warn); }
.tile.stop-hit { border-color: var(--down); box-shadow: inset 0 0 0 2px var(--down); }

/* New positions: one large card each (two at most). Lead stat: the club's result since the buy. */
.newpos { grid-auto-flow: row; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 1.4vw; }
.np { background: var(--panel); border: 2px solid var(--gold); border-radius: 1.6vh; padding: 2vh 1.6vw; display: flex; flex-direction: column; gap: 1.2vh; min-height: 0; overflow: hidden; }
.np .head { display: flex; align-items: baseline; gap: 1vw; flex-wrap: wrap; }
.np .sym { font: 700 7vh/1 var(--sans); }
.np .nm { font: 500 3.2vh var(--serif); }
.np .what { font-size: 3vh; color: var(--muted); line-height: 1.25; }
.np .lead .s, .np .nums .s { font-size: 3vh; color: var(--muted); }
.np .lead .v { font: 700 7vh/1.05 var(--sans); }
.np .nums { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4vh 1.2vw; margin-top: auto; }
.np .nums .v { font: 700 4.6vh/1.1 var(--sans); white-space: nowrap; }
.np .stop { border-top: 2px solid var(--line); padding-top: 1.4vh; }
.np .stop .line { font: 600 3.2vh var(--sans); }
.np .stop .rule { font-size: 3vh; color: var(--muted); margin-top: .6vh; }
.stopbar { position: relative; height: 2.4vh; border-radius: 99px; background: var(--panel-2); margin-top: 1.2vh; overflow: hidden; }
.stopbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--up); }
.stopbar.near i { background: var(--warn); } .stopbar.hit i { background: var(--down); }
.warn { color: var(--warn); }

/* Recent trades: one row per order, newest first. Side is gold (filled = buy, outlined = sell), so
   green and red keep meaning up and down. The move is the stock's price change since the trade. */
.trades { grid-template-rows: repeat(var(--rows, 5), minmax(0, 1fr)) auto; gap: 1vh; }
.trow { display: grid; grid-template-columns: 7vw 6vw 9vw minmax(0, 1fr) 15vw; align-items: center; column-gap: 1.2vw;
  background: var(--panel); border: 1px solid var(--line); border-radius: 1.2vh; padding: 0 1.4vw; min-height: 0; white-space: nowrap; }
.trow .d { font: 600 3.2vh var(--sans); color: var(--muted); }
.trow .side { font: 700 2.8vh/1 var(--sans); letter-spacing: .08em; padding: .8vh 0; border-radius: .6vh; text-align: center; }
.trow .side.buy { background: var(--gold-soft); color: var(--bg); border: 2px solid var(--gold-soft); }
.trow .side.sell { color: var(--gold-soft); border: 2px solid var(--gold-soft); }
.trow .sym { font: 700 4.2vh/1.05 var(--sans); }
.trow .fill { font: 600 3.2vh var(--sans); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.trow .fill small, .trow .since small { display: block; font: 500 3vh var(--sans); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.trow .since { text-align: right; font: 700 3.8vh var(--sans); }
.trades .tnote { font-size: 3vh; color: var(--muted); }

/* Movers: ranked by the stock's own move today. */
.movers { grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 1vh 1.6vw; align-content: start; }
.movers h3 { margin: 0 0 .6vh; font: 600 3vh var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mrow { display: grid; grid-template-columns: 10vw minmax(0, 1fr) auto; align-items: baseline; column-gap: .8vw; padding: 1.5vh 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.mrow .sym { font: 700 4.2vh var(--sans); }
.mrow .nm { color: var(--muted); font-size: 3vh; overflow: hidden; text-overflow: ellipsis; }
.mrow .mv { font: 700 4.2vh var(--sans); }
.alloc { grid-column: 1 / -1; align-self: end; }
.bar { display: grid; grid-template-columns: 22vw 1fr 8vw; align-items: center; gap: 1vw; margin: 1vh 0; font-size: 3vh; white-space: nowrap; }
.bar .track { height: 2.6vh; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar .track i { display: block; height: 100%; background: var(--gold); }
.bar .pct { text-align: right; font: 600 3.4vh var(--sans); }

/* Chart: the club's time-weighted return vs the S&P 500 (SPY price), both from 0% on Sept 22. */
.panel.chart.on { grid-template-rows: 1fr auto; background: var(--panel); border: 1px solid var(--line); border-radius: 1.4vh; padding: 2vh 1.4vw; }
.chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart .grid { stroke: var(--line); stroke-width: .14vh; }
.chart .axis { fill: var(--muted); font: 500 3vh var(--sans); }
.chart .line { fill: none; stroke: var(--gold); stroke-width: .5vh; stroke-linejoin: round; }
.chart .dot { fill: var(--bg); stroke: var(--gold-soft); stroke-width: .37vh; }
.chart .dot.live { fill: var(--gold); }
.chart .zero { stroke: var(--muted); stroke-width: .18vh; }
.chart .line.spy { stroke: #7fb0ec; stroke-dasharray: 1.2vh .8vh; } .chart .dot.spy { stroke: #7fb0ec; }
.chart .endlabel { font: 600 3.4vh var(--sans); fill: var(--gold-soft); }
.chart .endlabel.spy { fill: #7fb0ec; }
.chart .note { font-size: 3vh; color: var(--muted); }

.tape { overflow: hidden; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: .9vh 0; white-space: nowrap; }
.tape .track { display: inline-block; animation: scroll var(--tape-duration, 80s) linear infinite; }
.tape span { margin-right: 3vw; font-size: 3.2vh; }
.tape b { margin-right: .6vw; }
.tape .notice { color: var(--gold-soft); font-weight: 600; }
@keyframes scroll { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .tape .track { animation: none; } .pill.open::before { animation: none; } }

footer { display: flex; flex-wrap: wrap; gap: 0 1.6vw; font-size: 2.6vh; color: var(--muted); }
footer span { white-space: nowrap; }
footer .src { margin-left: auto; }
.error { display: grid; place-items: center; height: 100vh; font-size: 3vh; color: var(--muted); }
</style>
</head>
<body>
<script>
// Watchdog in a plain script: if the module never starts (for example a new page with an old
// cached core.js after a deploy) or stops ticking, reload. The module stamps window.__tvTick.
window.__tvTick = Date.now();
setInterval(function () { if (Date.now() - window.__tvTick > 120000) location.reload(); }, 90000);
</script>
<div class="tv" id="tv">
  <header>
    <div class="brand"><span class="org">Golisano Institute</span><span class="club">Investment Club</span></div>
    <div class="status"><span class="pill" id="pill">…</span><span id="session-note"></span></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="strip"><span class="notice" id="delay"></span><span class="asof" id="asof"></span></div>
  <div class="banner" id="banner" role="status"></div>
  <main>
    <section class="card left">
      <div><div class="label" id="hero-label">Invested value</div><div class="big" id="hero">—</div><div class="sub" id="hero-sub">Cash is not counted</div></div>
      <div class="grp" id="grp-day"><div class="label" id="day-label">Today</div>
        <div class="cmp"><span class="who">Club</span><span class="v" id="day">—</span></div>
        <div class="cmp bench"><span class="who">S&amp;P 500</span><span class="v" id="spy">—</span></div></div>
      <div class="grp" id="grp-since"><div class="label">Since Sept 22</div>
        <div class="cmp"><span class="who">Club</span><span class="v" id="since">—</span></div>
        <div class="cmp bench"><span class="who">S&amp;P 500</span><span class="v" id="spy-since">—</span></div></div>
    </section>
    <section class="right">
      <div class="panel-head"><h2 id="panel-title">Holdings</h2><div class="dots" id="dots"></div></div>
      <div class="panel newpos" id="p-new" data-title="New positions"></div>
      <div class="panel trades" id="p-trades" data-title="Recent trades"></div>
      <div id="holding-pages" style="display:contents"></div>
      <div class="panel movers" id="p-movers" data-title="Stock moves today"></div>
      <div class="panel chart" id="p-chart" data-title="Since Sept 22: Club vs S&amp;P 500">
        <div id="chart" style="position:relative; min-height:0"></div>
        <div class="note">Club: time-weighted return, so money moved by a trade is not gain or loss. S&amp;P 500: SPY price, dividends not counted.</div>
      </div>
    </section>
  </main>
  <div class="tape" aria-hidden="true"><div class="track" id="tape"></div></div>
  <footer id="footer"></footer>
</div>
<script type="module">
import {
  fetchJson, fetchVersion, buildChanged, mergeQuotes, marketStatus, freshness, compute, compareChart, el,
  sinceStatement, spySinceStatement, isNew,
  fmtUsd, fmtSignedUsd, fmtPct, fmtWeight, fmtPrice, arrow, dir, fmtTime, fmtDay, fmtShortDate,
  STATUS_LABEL, newestQuote, oldestQuote, delayNotice,
} from './core.js';

const params = new URLSearchParams(location.search);
// Only relative, same-origin paths may be loaded from the address bar.
const samePath = v => (v && !/^[a-z]+:|^\/\//i.test(v) ? v : null);
const CONFIG = {
  data: samePath(params.get('data')) || 'data/portfolio.json',
  quotes: samePath(params.get('quotes')),                  // default: payload.live_quotes_url (api/quotes)
  hideAmounts: params.get('amounts') === 'hide',
  rotateSeconds: params.get('rotate') ? Number(params.get('rotate')) : null, // overrides the per-panel times
  panel: params.get('panel'),                     // new | trades | h1 | h2 | h3 | movers | chart pins one panel
  pollSeconds: 60,
  reloadHours: 6,
  now: params.get('now') ? new Date(params.get('now')) : null, // test hook
};
// Seconds each panel stays up (84 s loop with two holdings pages).
const DWELL = { 'p-new': 15, 'p-trades': 12, 'p-movers': 12, 'p-chart': 15, holdings: 15 };
const now = () => CONFIG.now || new Date();
const $ = id => document.getElementById(id);
let payload;
let bootVersion = null;

async function boot() {
  try {
    payload = await fetchJson(CONFIG.data);
  } catch (e) {
    document.body.replaceChildren(el('div', { class: 'error' }, 'Portfolio data is unavailable. Retrying in one minute.'));
    window.__tvTick = Date.now();
    setTimeout(() => location.reload(), 60000);
    return;
  }
  bootVersion = await fetchVersion();
  if (CONFIG.hideAmounts) payload.amounts = payload.amounts === 'shown' ? 'shown-hidden' : payload.amounts;
  CONFIG.quotes = CONFIG.quotes ?? payload.live_quotes_url ?? null;
  render();
  poll();
  tick();
  setInterval(tick, 1000);
  setInterval(poll, CONFIG.pollSeconds * 1000);
  setInterval(shift, 180000);
  setTimeout(() => location.reload(), CONFIG.reloadHours * 3600000);
}

async function poll() {
  const v = await fetchVersion();
  if (buildChanged(bootVersion, v)) { location.reload(); return; }
  try {
    if (CONFIG.quotes) {
      if (mergeQuotes(payload, await fetchJson(CONFIG.quotes))) render();
    } else {
      const fresh = await fetchJson(CONFIG.data);
      if (newestQuote(fresh.quotes.items) > newestQuote(payload.quotes.items)) {
        fresh.amounts = payload.amounts;
        payload = fresh;
        render();
      }
    }
  } catch { /* keep last good prices; the banner reports their age */ }
  renderStatus();
}

function tick() {
  window.__tvTick = Date.now();
  $('clock').textContent = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }).format(now());
  if (new Date().getSeconds() === 0) renderStatus();
}

function render() {
  const forceHide = payload.amounts === 'shown-hidden';
  const base = forceHide ? { ...payload, amounts: 'shown' } : payload;
  const s = compute(base);
  const showDollars = s.dollars && !forceHide;
  renderNew(s, showDollars);
  renderTrades(s, showDollars);
  renderHoldings(s);
  renderMovers(s);
  renderStatus();      // after the pages exist: it writes their titles
  renderHero(base, s, showDollars);
  renderChart(base, s);
  renderTape(s);
  renderFooter();
  if (!document.querySelector('.panel.on')) rotate();
}

function renderStatus() {
  const st = marketStatus(now(), payload.calendar);
  const fr = freshness(payload.quotes.items, st, now(), payload.quotes.meta?.delay_minutes || 0);
  $('delay').textContent = delayNotice(payload);
  const items = payload.quotes.items;
  $('asof').textContent = `Prices from ${fmtTime(oldestQuote(items))}–${fmtTime(newestQuote(items))}, ${fmtDay(newestQuote(items))}`;
  const pill = $('pill');
  pill.className = `pill ${st.state}`;
  pill.textContent = st.holiday ? 'Market holiday' : STATUS_LABEL[st.state];
  $('session-note').textContent = st.earlyClose && (st.state === 'pre' || st.state === 'open') ? `Closes ${st.earlyClose.replace(/^13:00$/, '1:00 PM')} ET today` : '';
  const b = $('banner');
  if (!st.calendarKnown) {
    b.className = 'banner stale show';
    b.textContent = 'Exchange calendar needs updating (data/source/xnys-calendar.json); holidays and early closes are unknown.';
  } else if (fr.level === 'stale') {
    b.className = 'banner stale show';
    b.textContent = `${fr.reason}. Last saved price: ${fmtTime(fr.newest)}, ${fmtDay(fr.newest)}. Numbers below are from then, not now.`;
  } else {
    b.className = 'banner';
    b.textContent = '';
  }
  const when = fr.level === 'live' ? 'today' : fmtShortDate(fr.newest);
  $('day-label').textContent = fr.level === 'live' ? 'Today' : fmtShortDate(fr.newest);
  holdingPages.forEach((id, i) => {
    const n = $(id).childElementCount, from = i * PER_PAGE + 1;
    $(id).dataset.title = `Holdings ${from}–${from + n - 1} of ${holdingCount} · stock move ${when}`;
  });
  $('p-movers').dataset.title = `Stock moves ${when} · ${breadth.up} up, ${breadth.down} down`;
  if (panelIdx >= 0) $('panel-title').textContent = $(PANELS[panelIdx]).dataset.title;
}

const pct2 = x => `${arrow(x)} ${fmtPct(x)}`;
function setV(id, x) { const n = $(id); n.textContent = x === null || x === undefined ? '—' : pct2(x); n.className = `v ${x ? dir(x) : ''}`; }

// Left card: invested value, then today and since Sept 22, each as Club vs S&P 500.
function renderHero(base, s, showDollars) {
  const since = sinceStatement(base, s), spySince = spySinceStatement(base);
  setV('day', s.dayPct);
  setV('spy', s.spyDayPct);
  if (showDollars) {
    $('hero-label').textContent = 'Invested value';
    $('hero').textContent = fmtUsd(s.total);
    $('hero').className = 'big';
    $('hero-sub').textContent = 'Cash is not counted';
    $('grp-since').style.display = '';
    $('grp-day').parentElement.classList.remove('compact');
    setV('since', since);
    setV('spy-since', spySince);
  } else {
    // Percent only: the headline becomes the club's return since Sept 22.
    $('hero-label').textContent = 'Club since Sept 22';
    $('hero').textContent = pct2(since);
    $('hero').className = `big ${dir(since)}`;
    $('hero-sub').textContent = spySince === null ? '' : `S&P 500 ${fmtPct(spySince, 1)}`;
    $('grp-since').style.display = 'none';
    $('grp-day').parentElement.classList.add('compact');
  }
}

// Club: history[].twr (time-weighted, from 0 at the statement) and the live link. S&P 500: SPY's
// price over its statement price. Both start at 0% on Sept 22.
function renderChart(base, s) {
  const box = $('chart');
  if (!box.clientHeight) return; // hidden panel; the ResizeObserver redraws it when shown
  const hist = base.history || [];
  const spy0 = Number(hist[0]?.spy);
  const newest = newestQuote(base.quotes.items);
  const last = hist[hist.length - 1];
  const live = !last || newest > Date.parse(last.as_of_utc) + 60000;
  const club = hist.map(h => ({ t: Date.parse(h.as_of_utc), y: Number(h.twr) }));
  const spy = spy0 > 0 ? hist.filter(h => Number(h.spy) > 0).map(h => ({ t: Date.parse(h.as_of_utc), y: Number(h.spy) / spy0 - 1 })) : [];
  if (live) {
    club.push({ t: newest, live: true, y: sinceStatement(base, s) });
    const ss = spySinceStatement(base);
    if (ss !== null && spy.length) spy.push({ t: newest, live: true, y: ss });
  }
  const series = [{ name: 'Club', cls: 'port', points: club }, ...(spy.length ? [{ name: 'S&P 500', cls: 'spy', points: spy }] : [])];
  const w = Math.max(200, box.clientWidth), h = Math.max(120, box.clientHeight);
  const unit = innerHeight / 1080;
  box.replaceChildren(compareChart(series, { width: w, height: h, pad: 30 * unit, left: 104 * unit, right: 300 * unit, unit, charPx: 18 * unit,
    labelGap: 40 * unit, ariaNote: 'return since the Sept 22 statement' }));
  box.dataset.size = `${w}x${h}`;
}

// Redraw when the chart box changes size (banner appearing, window resize).
new ResizeObserver(() => {
  const box = $('chart');
  if (payload && box.dataset.size !== `${box.clientWidth}x${box.clientHeight}`) render();
}).observe(document.getElementById('chart'));

const barColor = pct => (pct > 0 ? 'var(--up)' : pct < 0 ? 'var(--down)' : 'var(--line)');
const sym = r => r.symbol.replace('/', '.');
const PER_PAGE = 10;
let holdingPages = [], holdingCount = 0;
let breadth = { up: 0, down: 0 };

function stopText(r) {
  if (r.stopPrice === undefined) return null;
  if (r.stopLevel === 'hit') return `At or below the stop ($${fmtPrice(r.stopPrice)})`;
  return `Stop $${fmtPrice(r.stopPrice)} · ${(r.stopGap * 100).toFixed(1)}% below today's price`;
}

// Holdings in pages of ten, largest first, read across the rows. Each tile shows the stock's own
// move today (not the club's trade-adjusted day), its share of the total and the club's gain.
function renderHoldings(s) {
  const rows = [...s.rows].sort((a, b) => b.weight - a.weight);
  const t = now().getTime();
  const tile = r => {
    const fresh = isNew(r, t), gain = fresh ? r.sinceBuy : r.costPct;
    return el('div', { class: `tile ${r.stopLevel && r.stopLevel !== 'ok' ? `stop-${r.stopLevel}` : ''}`, style: `--bar:${barColor(r.stockDayPct)}` },
      el('div', { class: 'sym' }, sym(r), fresh ? el('span', { class: 'badge' }, 'NEW') : null),
      el('div', { class: `day ${dir(r.stockDayPct)}` }, `${arrow(r.stockDayPct)} ${fmtPct(r.stockDayPct, 1)}`),
      el('div', { class: 'px' }, el('b', {}, fmtWeight(r.weight)), ' of total'),
      r.stopLevel && r.stopLevel !== 'ok'
        ? el('div', { class: 'meta' }, el('b', { class: r.stopLevel === 'hit' ? 'down' : 'warn' }, r.stopLevel === 'hit' ? 'AT STOP' : 'NEAR STOP'))
        : el('div', { class: 'meta' }, 'our gain ', el('b', { class: dir(gain) }, fmtPct(gain, 1))));
  };
  const pages = [];
  for (let i = 0; i < rows.length; i += PER_PAGE) pages.push(rows.slice(i, i + PER_PAGE));
  holdingCount = rows.length;
  const ids = pages.map((_, i) => `p-h${i + 1}`);
  if (ids.join() !== holdingPages.join()) {
    $('holding-pages').replaceChildren(...ids.map(id => el('div', { class: 'panel rows10', id })));
    holdingPages = ids;
    setPanels();
  }
  pages.forEach((pg, i) => $(ids[i]).replaceChildren(...pg.map(tile)));
}

// One large card per position bought in the last two weeks (two at most, newest first).
function renderNew(s, showDollars) {
  const t = now().getTime();
  const fresh = s.rows.filter(r => isNew(r, t)).sort((a, b) => b.openedAt - a.openedAt || a.symbol.localeCompare(b.symbol));
  newCount = fresh.length;
  const stat = (label, v, d) => el('div', {}, el('div', { class: 's' }, label), el('div', { class: `v ${d === undefined ? '' : dir(d)}` }, v));
  const card = r => {
    const stop = stopText(r);
    const range = r.stopPrice !== undefined ? Math.max(0, Math.min(1, (r.price - r.stopPrice) / (r.buyPrice - r.stopPrice) / 1.5)) : 0;
    return el('div', { class: 'np' },
      el('div', { class: 'head' }, el('span', { class: 'sym' }, sym(r)), el('span', { class: 'nm' }, r.name),
        el('span', { class: 'badge' }, `BOUGHT ${fmtShortDate(r.openedAt).toUpperCase()}`)),
      r.industry ? el('div', { class: 'what' }, r.industry) : null,
      el('div', { class: 'lead' }, el('div', { class: 's' }, 'Since we bought'),
        el('div', { class: `v ${dir(r.sinceBuy)}` }, `${arrow(r.sinceBuy)} ${fmtPct(r.sinceBuy, 1)}`)),
      el('div', { class: 'nums' },
        stat('Bought at', `$${fmtPrice(r.buyPrice)}`), stat('Now', `$${fmtPrice(r.price)}`),
        stat('Stock today', `${arrow(r.stockDayPct)} ${fmtPct(r.stockDayPct, 1)}`, r.stockDayPct),
        showDollars ? stat(`${r.shares} shares, worth`, fmtUsd(r.value)) : stat('Share of total', fmtWeight(r.weight))),
      stop
        ? el('div', { class: 'stop' },
          el('div', { class: `line ${r.stopLevel === 'ok' ? '' : r.stopLevel === 'hit' ? 'down' : 'warn'}` }, stop),
          el('div', { class: `stopbar ${r.stopLevel}`, role: 'img', 'aria-label': `Price distance above the stop: ${(r.stopGap * 100).toFixed(1)}%` },
            el('i', { style: `width:${(range * 100).toFixed(1)}%` })),
          el('div', { class: 'rule' }, r.stopRule ? `Club rule, checked at the close: ${r.stopRule.replace(/\s*\(.*\)\.?$/, '.')}` : ''))
        : null);
  };
  const shown = fresh.slice(0, 2);
  $('p-new').style.setProperty('--n', Math.max(shown.length, 1));
  $('p-new').replaceChildren(...shown.map(card));
  $('p-new').dataset.title = fresh.length === 1 ? `New position · bought ${fmtShortDate(fresh[0].openedAt)}` : `New positions · bought ${[...new Set(fresh.map(r => fmtShortDate(r.openedAt)))].join(', ')}`;
  if (Boolean(fresh.length) !== PANELS.includes('p-new')) setPanels();
}

// Recent trades, newest first. The move is the stock's price change since the trade, coloured by
// its own direction.
const TRADE_ROWS = 5;
let tradeCount = 0;
function renderTrades(s, showDollars) {
  const prices = new Map(s.rows.map(r => [r.symbol, r.price]));
  const list = [...(payload.trades || [])].sort((a, b) => b.executed_at_utc.localeCompare(a.executed_at_utc) || a.symbol.localeCompare(b.symbol));
  tradeCount = list.length;
  const row = t => {
    const px = Number(t.price), cur = prices.get(t.symbol);
    const x = cur ? cur / px - 1 : null;
    const small = [t.estimated ? 'est.' : null, showDollars && t.realized_gain ? `${fmtSignedUsd(Number(t.realized_gain))} gain` : null].filter(Boolean).join(' · ')
      || (showDollars && t.amount ? fmtUsd(Number(t.amount)) : '');
    return el('div', { class: 'trow' },
      el('div', { class: 'd' }, fmtShortDate(Date.parse(t.executed_at_utc))),
      el('div', { class: `side ${t.type}` }, t.type === 'buy' ? 'BUY' : 'SELL'),
      el('div', { class: 'sym' }, t.symbol.replace('/', '.')),
      el('div', { class: 'fill' }, showDollars && t.shares ? `${t.shares} @ $${fmtPrice(px)}` : `at $${fmtPrice(px)}`, el('small', {}, small)),
      el('div', { class: `since ${x === null ? '' : dir(x)}` }, x === null ? '—' : `${arrow(x)} ${fmtPct(x, 1)}`,
        el('small', {}, t.type === 'buy' ? 'since we bought' : 'since we sold')));
  };
  const shown = list.slice(0, TRADE_ROWS);
  $('p-trades').style.setProperty('--rows', Math.max(shown.length, 4));
  $('p-trades').replaceChildren(...shown.map(row),
    el('div', { class: 'tnote' }, list.length > shown.length ? `${list.length - shown.length} earlier trades on the trades page.` : 'Every trade since Sept 22 is on the trades page.'));
  $('p-trades').dataset.title = list.length ? `Recent trades · ${list.length} since Sept 22` : 'Recent trades';
  if (Boolean(list.length) !== PANELS.includes('p-trades')) setPanels();
}

// Stock moves today: top and bottom three by the stock's own move, and where the money is.
function renderMovers(s) {
  const byMove = [...s.rows].sort((a, b) => b.stockDayPct - a.stockDayPct);
  breadth = { up: s.rows.filter(r => r.stockDayPct > 0).length, down: s.rows.filter(r => r.stockDayPct < 0).length };
  const row = r => el('div', { class: 'mrow' },
    el('span', { class: 'sym' }, sym(r)),
    el('span', { class: 'nm' }, r.name),
    el('span', { class: `mv ${dir(r.stockDayPct)}` }, `${arrow(r.stockDayPct)} ${fmtPct(r.stockDayPct)}`));
  const mag7 = new Set(['AAPL', 'MSFT', 'AMZN', 'GOOGL', 'META', 'NVDA', 'TSLA']);
  const w = pred => s.rows.filter(pred).reduce((a, r) => a + r.weight, 0);
  const groups = [
    ['S&P 500 fund (SPY)', w(r => r.symbol === 'SPY')],
    ['Magnificent Seven', w(r => mag7.has(r.symbol))],
    ['Other stocks', w(r => r.symbol !== 'SPY' && !mag7.has(r.symbol))],
  ];
  $('p-movers').replaceChildren(
    el('div', {}, el('h3', {}, 'Top 3'), byMove.slice(0, 3).map(row)),
    el('div', {}, el('h3', {}, 'Bottom 3'), byMove.slice(-3).reverse().map(row)),
    el('div', { class: 'alloc' }, el('h3', {}, 'Where the money is'),
      groups.map(([name, x]) => el('div', { class: 'bar' }, el('span', {}, name),
        el('span', { class: 'track' }, el('i', { style: `width:${x * 100}%` })), el('span', { class: 'pct' }, fmtWeight(x))))));
}

// The delay notice must recur on a ticker at least every 90 seconds: put it before every 7th
// symbol (7 items x 4.5 s = 31.5 s apart).
function renderTape(s) {
  const items = [];
  s.rows.forEach((r, i) => {
    if (i % 7 === 0) items.push(el('span', { class: 'notice' }, delayNotice(payload)));
    items.push(el('span', {}, el('b', {}, sym(r)), `$${fmtPrice(r.price)} `,
      el('span', { class: dir(r.stockDayPct), style: 'margin:0' }, `${arrow(r.stockDayPct)} ${fmtPct(r.stockDayPct)}`)));
  });
  const clone = items.map(n => n.cloneNode(true));
  $('tape').replaceChildren(...items, ...clone);
  $('tape').style.setProperty('--tape-duration', `${items.length * 4.5}s`);
}

// Footer: the disclosure sentences as separate spans (advice notice first; the time-weighted
// sentence is in the chart note), then the price source.
function renderFooter() {
  const sentences = (payload.disclosure.match(/[^.]+\.(\s|$)/g) || [payload.disclosure]).map(x => x.trim())
    .filter(x => !/time-weighted/i.test(x));
  const advice = sentences.filter(x => /not investment advice/i.test(x));
  const rest = sentences.filter(x => !/not investment advice/i.test(x));
  const src = payload.quotes.meta?.attribution || [...new Set(payload.quotes.items.map(q => q.provider))].join(', ');
  $('footer').replaceChildren(...[...advice, ...rest].map(x => el('span', {}, x)), el('span', { class: 'src' }, src));
}

let PANELS = [];
let panelIdx = -1, newCount = 0, rotateTimer = null;
// Rotation: new positions (while any are new), recent trades, each holdings page, movers, chart.
function setPanels() {
  const current = PANELS[panelIdx];
  PANELS = [...(newCount ? ['p-new'] : []), ...(tradeCount ? ['p-trades'] : []), ...holdingPages, 'p-movers', 'p-chart'];
  panelIdx = PANELS.indexOf(current);
  // A pinned panel (?panel=) may only exist once its page is built: switch to it then.
  if (panelIdx < 0 || (PANELS.includes(`p-${CONFIG.panel}`) && current !== `p-${CONFIG.panel}`)) { panelIdx = -1; rotate(); return; }
  PANELS.forEach((id, i) => $(id).classList.toggle('on', i === panelIdx));
  $('dots').replaceChildren(...PANELS.map((_, i) => el('i', { class: i === panelIdx ? 'on' : '' })));
}
function dwell(id) { return (CONFIG.rotateSeconds || DWELL[id] || DWELL.holdings) * 1000; }
function rotate() {
  clearTimeout(rotateTimer);
  if (!PANELS.length) return;
  const pinned = PANELS.indexOf(`p-${CONFIG.panel}`);
  if (!(pinned >= 0 && panelIdx === pinned)) {
    panelIdx = pinned >= 0 ? pinned : (panelIdx + 1) % PANELS.length;
    document.querySelectorAll('.right .panel').forEach(n => n.classList.toggle('on', n.id === PANELS[panelIdx]));
    $('panel-title').textContent = $(PANELS[panelIdx]).dataset.title;
    $('dots').replaceChildren(...PANELS.map((_, i) => el('i', { class: i === panelIdx ? 'on' : '' })));
  }
  if (pinned < 0) rotateTimer = setTimeout(rotate, dwell(PANELS[panelIdx]));
}

// Small periodic shift of the whole layout to spread static pixels (burn-in care).
const OFFSETS = [[0, 0], [3, 2], [-3, 3], [2, -3], [-2, -2]];
let shiftIdx = 0;
function shift() {
  shiftIdx = (shiftIdx + 1) % OFFSETS.length;
  const [x, y] = OFFSETS[shiftIdx];
  $('tv').style.transform = `translate(${x}px, ${y}px)`;
}

window.addEventListener('resize', () => payload && render());
boot();
</script>
</body>
</html>
